name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: papernas_test
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U papernas_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PAPERNAS_V2_TEST_ADMIN_URL: postgresql://papernas_test:ci-disposable-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e './backend[test]'
      - run: ruff check backend/papernas_v2 backend/tests backend/scripts
      - run: pytest -q backend/tests
      - run: python scripts/audit-public.py
      - run: python scripts/package-source.py
      - run: python backend/scripts/build_web.py
      - run: python -m pip wheel --no-deps ./backend --wheel-dir dist
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: node --test frontend/tests/*.test.js
      - run: npm --prefix frontend run check
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: bash scripts/test-mac.sh
      - run: bash scripts/build-app.sh release
