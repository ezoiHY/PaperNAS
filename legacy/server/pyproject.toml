[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-nas-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.27,<1"]

[project.scripts]
paper-nas-api = "paper_nas.app:main"

[tool.setuptools.packages.find]
include = ["paper_nas*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
